id = "E20"
title = "A GPU type the documentation does not name"
request = "We were given access to new nodes with NVIDIA L40S GPUs (gres l40s). Can the lanes do motion correction and membrane segmentation on them, with the group's MotionCor3 1.2.4 and MemBrain-seg 0.0.10?"
note = "A knowledge case (eval_cases.md, Knowledge): the request holds the evidence. Its answer is in NVIDIA's table of compute capabilities, read on 16 November 2026, and nowhere in the repository. Run it without --library and with a library whose snapshot holds nvidia."
library = ["nvidia"]
pass_if = ["it gives the L40S compute capability 8.9, from NVIDIA's table of compute capabilities when it has the library", "it says MemBrain-seg's minimum of 7.5 is met, and that whether its PyTorch has code for 8.9 is read by scripts/show_setup.py", "it says MotionCor3 runs there if its build has code for 8.9 (a cubin of 8.x up to 8.9, or PTX), that the published makefile has sm_89 but the group's build has not been read, and how to check: show_setup.py on such a node, or cuobjdump, and the job's preflight"]
must_not = ["give the L40S another compute capability", "answer yes or no without saying how the builds' GPU code is checked", "run srun or sbatch itself"]

# Checks scripts/grade_cases.py runs on a batch; a box with none is left for a person (README.md).
[[check]]
box = "it gives the L40S compute capability 8.9, from NVIDIA's table of compute capabilities when it has the library"
in = "answer"
all = ['8\.9']
necessary = true

[[check]]
box = "did not: run srun or sbatch itself"
in = "commands"
none = ['^Bash: (.*[\s/])?(srun|sbatch)(\s|$)']
