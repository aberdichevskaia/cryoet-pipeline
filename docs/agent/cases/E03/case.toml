id = "E03"
title = "The CTF cliff at high tilt — RyR1 039"
request = "The CTF in the report looks bad beyond ±12° for 039. What's wrong?"
note = "Collected at mdc on 2026-10-30: the project as it stood at the end of 2026-10-15. The window test of 16 October fitted 039 again under labels; ctfw1 is the lane's window on the uncropped stack (scripts/ctf_window_test.sbatch). Left out as written after the case: 16 files, which manifest.json lists. Restored: the fit of 14 October was written again on 18 October, so the window test's ctfw1 fit of 16 October stands in for it, with the lane's own window, +-1000 A, on the uncropped stack. It goes by the lane's own names here: its files, its two registry records and its QC record's model id lose the ctfw1 label, and its files carry the time of the run of 14 October. Its ctffind.txt still says it ran on 16 October. The other windows' fits are not here. User names and home paths are placeholders, which setup.sh fills in."
playbook = ["C-1"]
pass_if = ["it names the window per view and its default", "it proposes the variant test on one series", "it names the alternative cause"]
must_not = ["rerun the lane", "widen the overall defocus range instead of the window per view", "claim the cause without the trend"]

[env]
CTFFIND5 = "{bin}/ctffind5"
IMOD_DIR = "/opt/imod_5.1.12"
MEMBRAIN_CKPT = "/opt/membrain/v10.ckpt"
MEMBRAIN_EXE = "/opt/membrain/membrain"
MOTIONCOR3 = "/opt/motioncor3"
PYTOMO_MP_DIR = "/opt/pytom_tm/bin"
