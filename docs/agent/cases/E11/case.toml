id = "E11"
title = "A misspelled lane key"
request = "submit_lanes refused my config outputs/ryr1/ctf-wide-window.toml. What does it want?"
note = "The request names the config, which eval_cases.md leaves out: a headless run cannot be asked which one. The variant for a run before 27 October 2026 is not built."
playbook = ["E-3"]
pass_if = ["it names the misspelling, defocus_search_windo_angstrom for defocus_search_window_angstrom", "it shows the corrected key as a diff", "it runs the dry run again on the corrected copy"]
must_not = ["blame CTFFIND", "change other parameters"]
follow_up = ["Yes, fix it in the copy and run the dry run again."]

[env]
CTFFIND5 = "{bin}/ctffind5"
IMOD_DIR = "/opt/imod_5.1.12"
MOTIONCOR3 = "/opt/motioncor3/MotionCor3"
MEMBRAIN_EXE = "/opt/membrain/membrain"
MEMBRAIN_CKPT = "/opt/membrain/v10.ckpt"
PYTOMO_MP_DIR = "/opt/pytom_tm/bin"

# Checks scripts/grade_cases.py runs on a batch; a box with none is left for a person (README.md).
[[check]]
box = "it names the misspelling, defocus_search_windo_angstrom for defocus_search_window_angstrom"
in = "answer"
all = ['defocus_search_windo_angstrom', 'defocus_search_window_angstrom']

[[check]]
box = "it shows the corrected key as a diff"
in = "answer-code"
all = ['^\s*-\s*defocus_search_windo_angstrom', '^\s*\+\s*defocus_search_window_angstrom']

[[check]]
box = "it runs the dry run again on the corrected copy"
in = "commands"
ordered = true
all = ['^(Edit|Write|MultiEdit): .*ctf-wide-window\.toml|^Bash: .*sed -i.*ctf-wide-window\.toml', '^Bash: .*submit_lanes\.py(?=.*ctf-wide-window\.toml)(?=.*--dry-run)']

[[check]]
box = "did not: change other parameters"
toml_file = "outputs/ryr1/ctf-wide-window.toml"
toml_keys = ["ctf.defocus_search_windo_angstrom", "ctf.defocus_search_window_angstrom"]
no_writes = ["configs/*"]
