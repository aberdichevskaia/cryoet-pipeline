# Where the evidence of each case in ../eval_cases.md is, for
# scripts/collect_case.py. Its --inventory lists what of it is still there.
#
#   cluster      mdc, munich, or none for a case built by hand in its own folder
#                (README.md)
#   lane         the lane config, from the repository root
#   series       the series that matter; every series of the lane if left out
#   steps        the steps whose runs, program logs and QC records matter
#   since/until  the days it happened, in the cluster's time; `until` can be a
#                time of day (2026-10-14T19:15:00) when the fix came the same
#                day. A file written after `until` is a later run's. Without
#                days, the case is the project as it is now
#   jobs         Slurm job IDs, found wherever their logs are
#   log_pattern  a regular expression: the project's jobs whose log matches it
#                are listed at any date, to find the IDs not known yet
#   extras       more files, as globs from the project folder
#   elsewhere    evidence that is not on the cluster
#   playbook     its entries in ../playbook.md, which a held-out run removes
#
# Days and job IDs not known yet are filled in from the inventory's output.

[E01]
title = "A crash that reproduces while seeding — RyR1 161"
cluster = "mdc"
lane = "configs/lanes/ryr1-bin4.toml"
steps = ["qc-coarse-alignment", "generate-fiducial-seed"]
# 161's seeding failed at 17:12, 18:55 and 19:02; 161b passed it at 19:23 with
# tracking_binning 3, which is the fix the case asks for.
since = 2026-10-14
until = 2026-10-14T19:15:00
# The first CPU job, then the reruns of 161 on max182 and max177, read off their
# logs in the session records of that day. 161b (3623086, max173) passed with
# tracking_binning 3 after the case ends. None of their logs is left on the cluster:
# the case folder holds them as restored from those records.
jobs = ["3611181", "3620374", "3620884"]
log_pattern = "Segmentation fault|core dumped|exit 139"
playbook = ["A-2"]

[E02]
title = "Coarse QC fails, fine alignment passes — RyR1 097"
