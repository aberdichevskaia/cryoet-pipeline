[E03]
title = "The CTF cliff at high tilt — RyR1 039"
cluster = "mdc"
lane = "configs/lanes/ryr1-bin4.toml"
series = ["039"]
steps = ["estimate-ctf"]
since = 2026-10-14
until = 2026-10-15
extras = ["ctf/039/039_ctffind5.defocus", "ctf/039/039_ctffind5_ctffind.txt"]
note = """The window test of 16 October fitted 039 again under labels; ctfw1 is the \
lane's window on the uncropped stack (scripts/ctf_window_test.sbatch). The fit of \
14 October was written again on 18 October, so the case folder holds ctfw1 under the \
lane's own names in its place, restored from the cluster."""
playbook = ["C-1"]

[E04]
title = "Out of GPU memory in template matching — HIV-1 Gag"
cluster = "munich"
lane = "configs/lanes/gag-bin8.toml"
series = ["TS_01"]
steps = ["pick-particles"]
# The pick failed at 23:10 on 7 October and passed at 00:45 on the 8th: the case
# ends with the 7th.
since = 2026-10-07
until = 2026-10-07
jobs = ["41075712"]
log_pattern = "out of memory|OutOfMemory"
note = """The GPU slice is in sacct's AllocTRES; the log's nvidia-smi line shows the \
whole card."""
playbook = ["P-1"]

[E05]
title = "The wrong CTFFIND at MDC"
cluster = "mdc"
lane = "configs/lanes/ribo-mdc.toml"
steps = ["estimate-ctf"]
# 3781480 failed at 15:57 on 28 October; 3783610 ran the copy again at 16:55,
# by then naming CTFFIND 5.
since = 2026-10-16
until = 2026-10-28T16:30:00
jobs = ["3670792", "3781480"]
log_pattern = 'CTFFIND 4\.1|ctffind-4\.'
playbook = ["C-2"]

