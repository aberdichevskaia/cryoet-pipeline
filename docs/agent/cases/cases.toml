# Where the evidence of each case in ../eval_cases.md is, for
# scripts/collect_case.py. Its --inventory lists what of it is still there.
#
#   cluster      mdc, munich, or none for a case built by hand in its own folder
#                (README.md)
#   lane         the lane config, from the repository root
#   series       the series that matter; every series of the lane if left out
#   steps        the steps whose runs, program logs and QC records matter
#   since/until  the days it happened, in the cluster's time. A file written
#                after `until` is a later run's. Without days, the case is the
#                project as it is now
#   jobs         Slurm job IDs, found wherever their logs are
#   log_pattern  a regular expression: the project's jobs whose log matches it
#                are listed at any date, to find the IDs not known yet
#   extras       more files, as globs from the project folder
#   elsewhere    evidence that is not on the cluster
#
# Days and job IDs not known yet are filled in from the inventory's output.

[E01]
title = "A crash that reproduces while seeding — RyR1 161"
cluster = "mdc"
lane = "configs/lanes/ryr1-bin4.toml"
steps = ["qc-coarse-alignment", "generate-fiducial-seed"]
