[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cryoet-pipeline"
version = "0.1.0"
description = "Extensible Python pipeline for cryo-ET preprocessing from raw tilt movies to tomograms."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Anna Berdichevskaia" }
]
# Every cryoet command imports torch, mrcfile, zarr and matplotlib (measured on
# 22 November 2026 by blocking each import), so what were the io, gpu and viz
# extras is needed by any install: a plain `pip install -e .` gave a cryoet that
# did not start.
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.7",
  "typer>=0.12",
  "PyYAML>=6.0",
  "mrcfile>=1.5",
  "pyarrow>=16",
  "tifffile>=2023.1",
  "zarr>=2.18",
  "torch>=2.2",
  "torch-fourier-shell-correlation>=0.5",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
# Kept, empty, so that the install commands that name them still work.
io = []
gpu = []
viz = []
# scripts/build_library.py: the PDF manuals it pins (AreTomo2's).
library = [
  "pypdf>=7.0",
]
dev = [
  "pypdf>=7.0",
  "pytest>=8.2",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML>=6.0",
]

[project.scripts]
cryoet = "cryoet_pipeline.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/cryoet_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["cryoet_pipeline"]
