[web.conda-docs]
# conda's user guide: environments, packages, channels and Python; virtual
# packages (__cuda, and CONDA_OVERRIDE_CUDA where no GPU is seen); .condarc and
# every setting in it; where environments and the package cache go; pip inside
# an environment; temporary files; installations shared by a group; package
