# Starting point for a new dataset. Copy it to configs/lanes/<name>.toml and
# work through it top to bottom; every line marked EDIT depends on your data.
# The values here are placeholders or generic starting values, not measurements.
#
# The order of the steps is fixed in scripts/run_series.py. This file chooses:
#   [lane] input   - movies ("frames", MRC or TIFF) or one assembled stack per tilt-series
#   alignment      - gold beads or patch tracking (no gold): one of two blocks below
#   [segment]      - present: membranes are segmented; delete it to skip
#
# List the steps your choices give:
#   python3 scripts/run_series.py --project x --config <this file> --series X --list-steps
# Check the whole config without submitting anything:
#   python3 scripts/submit_lanes.py <this file> --dry-run
#
# configs/lanes/gag-bin8.toml (movies, beads, membranes) and ribo-bin8.toml
# (stacks, patches) are worked examples: their comments explain how each of
# their values was chosen.

[lane]
name = "my-lane-bin8"     # EDIT: any name, for you
input = "frames"          # EDIT: "frames" (movies + mdocs or file names) or "stack" (one MRC stack per tilt-series)
variant = "bin8"          # label on every output from the tomogram on; keep it short

[run]
# EDIT: where the outputs go (a new folder per project), and the tilt-series
# ids. An id is the mdoc name without ".mrc.mdoc" / ".mdoc", or, with
# [data] frames_pattern, the text its `series` group matches. Leave `series`
# out to take every series: init finds them for movies, and a stack lane looks
# for them with {series} in [data] stack as the wildcard.
project = "outputs/my-project"
series = ["TS_01", "TS_02"]

# Each stage is one Slurm job that runs the steps from..until for every series in
# turn; the next starts only when the previous one succeeded. Stages must follow
# one another without skipping a step. With input = "stack", replace the
# "motion" stage by a CPU stage starting at "import-tilt-stack". With [segment]
# deleted, the "gpu" stage starts at "prepare-template".
[[run.stage]]
name = "motion"
from = "prepare-tilt-series"
until = "prepare-tilt-series"
time = "3:00:00"
sbatch = ["--partition=gpu_p", "--qos=gpu_normal", "--gres=gpu:a100_3g.20gb:1",
          "--cpus-per-task=8", "--mem=64G"]

[[run.stage]]
name = "cpu"
from = "align-tilt-series"
until = "reconstruct-tomogram"
time = "8:00:00"
sbatch = ["--partition=cpu_p", "--qos=cpu_normal", "--cpus-per-task=8", "--mem=32G"]

[[run.stage]]
name = "gpu"
from = "segment-tomogram"
until = "extract-particles"
time = "16:00:00"
sbatch = ["--partition=gpu_p", "--qos=gpu_normal", "--gres=gpu:a100_3g.20gb:1",
          "--cpus-per-task=8", "--mem=64G"]

[data]
# EDIT. Paths are relative to the repository root.
# input = "frames": the movie folder, MRC (.mrc) or TIFF (.tif/.tiff), and
# where the tilt angles come from - exactly one of:
#   mdocs:          SerialEM mdocs. The movie file names must match their
#                   SubFramePath lines (only the file name counts, not the folder).
#   frames_pattern: no mdocs; the angles are read from the movie file names with
#                   a regular expression matched against the whole name. Its named
#                   groups say where the series id, the tilt number and the angle
#                   are. Write it in single quotes, so TOML leaves the backslashes
#                   alone. Without mdocs, also set [align] tilt_axis_angle.
#                   `cryoet init` prints the tilts and angle range it found per
#                   series: check them before the jobs run.
frames = "data/my-dataset/frames"
mdocs = "data/my-dataset/mdocs"
# frames_pattern = 'tomogram_(?P<series>\d+)_(?P<tilt>\d+)_(?P<angle>[-+]?\d+(?:\.\d+)?)\.tif'
# The raw movie pixel size in A. Read from the movie headers when unset: the MRC
# header, or the resolution tags SerialEM writes into a TIFF (`header` from IMOD
# shows it). Set it only to override a header known to be wrong.
# pixel_size_angstrom = 1.35
# input = "stack": one file each per tilt-series; {series} is replaced by the id.
# mdoc = "data/my-dataset/mdocs/{series}.mrc.mdoc"
# stack = "data/my-dataset/stacks/{series}.mrc"

[motion]
# input = "frames" only. MRC and TIFF movies; EER is not supported yet.
backend = "motioncor3"
patch_x = 5
patch_y = 5
gpu = 0
storage_policy = "working"
# The pixel size in A given to MotionCor3. Left unset, it is the raw pixel size
# from [data]: the movie headers, or pixel_size_angstrom. It does not change the
# tilt stack's pixel size, which comes from there either way. Dose weighting is
# off in this backend, so MotionCor3 uses it for little else; there is normally
# no reason to set it.
# pixel_size_angstrom = 1.35
# EDIT if your movies are not gain-corrected: the gain reference (MRC), and its
# rotation (0-3) and flip (0-2) relative to the movies, as MotionCor3 defines them.
# gain_reference = "data/my-dataset/gain.mrc"
# gain_rotation = 0
# gain_flip = 0
# Fourier binning of the sums (MotionCor3 -FtBin). 2 brings super-resolution
# frames to the physical pixel, which is all most tomography needs and a quarter
# of the disk; the tilt stack, and every binning below, is then at the movie
# pixel times this. Left unset, the sums keep the movie pixel.
# ftbin = 2

[binning]
# EDIT. Binning factors relative to the tilt stack's pixel: the movie pixel,
# times [motion] ftbin if set. Choose by the pixel size they give, not by the
# number:
#   tomogram: your particle should still be a few tens of pixels across. The
#             worked examples have a ribosome at 30 px (9.8 A/px) and Gag at
#             46 px (5.4 A/px).
#   ctf_fit:  the CTF is fitted on a finer stack. Its Nyquist (2 x pixel size)
#             should be finer than ~6 A, or the stack limits the fit.
ctf_fit = 2
tomogram = 8

[align]
binning = 8               # coarse alignment; the same as [binning] tomogram is fine
min_std_ratio = 0.2
# tilt_axis_angle = 85.0  # if the mdoc's RotationAngle is wrong; required without mdocs

[qc_coarse]
preview_binning = 16
residual_warning_px = 2.0

# =============================================================================
# Alignment. EDIT: keep ONE of the two blocks below and delete the other.
#
# Each block sets [fiducials], [fine_align] and [reconstruct] together, because
# the right fine alignment and tomogram thickness follow from how the series is
# tracked. Switching only [fiducials] leaves the other two tuned for the wrong
# method: some of that fails, and some of it runs to the end and positions the
# tomogram wrongly.
#
# To use block B: delete block A, then remove "# " from the start of every line
# of block B. Lines that then still start with "#" are comments, as intended.
# =============================================================================

# --- Block A: gold beads -----------------------------------------------------
[fiducials]
seed_backend = "imod-autofidseed"
track_backend = "imod-beadtrack"
tracking_binning = 4
fiducial_diameter_nm = 10.0           # EDIT: your gold size
# The pixel size the bead diameter is converted with. Left unset, it is read
# from the data and checked against the stack; set, it is used WITHOUT that
# check. Neither worked example needs it: gag-bin8.toml's value equals the
# pixel size in its movie headers.
# raw_pixel_spacing_angstrom = 1.35

[fine_align]
robust_fitting = true
auto_prune_outliers = true
surfaces_to_analyze = 2               # beads sit on both faces of the sample

[reconstruct]
# Thickness in binned pixels. Left unset, it is derived from the beads, which
# measure the sample depth because they sit on both faces. Set it to override.
# thickness = 300

# --- Block B: patch tracking, no gold (e.g. FIB lamellae) --------------------
# [fiducials]
# seed_backend = "imod-patch-seed"
# track_backend = "imod-patch-track"
# pre_binning = 8
# num_patches_x = 5
# num_patches_y = 5
# patch_overlap = 0.33
# patch_margin_px = 100               # binned pixels; see ribo-bin8.toml for sizing the grid
#
# [fine_align]
# robust_fitting = true
# auto_prune_outliers = true
# surfaces_to_analyze = 1             # patch points are coplanar: one plane, not two
# # Up to two whole patches may be dropped as outliers: 2 / (num_patches_x x
# # num_patches_y) = 2 / 25. The default, 0.02, is sized for beads, and a single
# # bad patch (1 / 25 = 4%) already exceeds it.
# max_pruned_fraction = 0.08
#
# [reconstruct]
# # Required with patches, which cannot measure the sample depth. In binned
# # pixels; be generous, so the tomogram contains vacuum above and below.
# thickness = 320
# --- end of block B ----------------------------------------------------------

[ctf]
# EDIT: microscope and defocus. Make the defocus range bracket the nominal
# defocus with ~0.5-1 um to spare on each side.
voltage_kv = 300.0
spherical_aberration_mm = 2.7
amplitude_contrast = 0.07
min_defocus_angstrom = 10000
max_defocus_angstrom = 50000

[segment]
# Membrane segmentation with MemBrain-seg. Delete this whole section to skip it.
# Needs a GPU of compute capability 7.5 or newer. Keeping it lets picking be
# restricted to membranes; see [pick].
executable = "$MEMBRAIN_EXE"
model = "$MEMBRAIN_CKPT"
sliding_window_size = 160
test_time_augmentation = true

[template]
# EDIT: the reference for template matching. Exactly one of:
emdb_id = "EMD-XXXXX"                 # fetched from EMDB
# source_map = "data/my-dataset/reference.mrc"   # or a local map
low_pass_angstrom = 20.0              # EDIT: about 2 x the tomogram pixel size
# Mask and box come from [pick] particle_diameter_angstrom, which is why that has
# to be the particle's diameter where it is WIDEST: the mask radius is half of it
# plus 3 px, with a 1 px soft edge, and the box is twice the diameter. Set these
# only to override that, e.g. for a lattice map with no single particle in it.
# mask_radius_px = 18
# mask_sigma_px = 1.0                 # 0 for a hard edge
# box_size_px = 60

[pick]
particle_diameter_angstrom = 250.0    # EDIT: your particle at its widest; sets the angular
                                      # sampling and the template's mask and box
number_of_particles = 2000            # candidates kept per tomogram, before your review
number_of_false_positives = 100.0
low_pass_angstrom = 30.0              # EDIT: a little above the tomogram's Nyquist
                                      # (2 x pixel), ~1.3x: Nyquist 19.6 A -> 25 A
random_phase_correction = true
per_tilt_weighting = true
spectral_whitening = true
tophat_filter = false
gpu_ids = "0"
# Rotational symmetry of the template about its z axis (e.g. 4 for a C4 map):
# cuts the angular search that many times. Only for a template whose symmetry
# axis is its z axis, through the box centre, as RELION and Dynamo impose it.
# z_axis_symmetry = 4
# If picking runs out of GPU memory, split the tomogram: "x,y,z" pieces.
# volume_split = "2,2,1"
# Only for particles that sit on or next to membranes (needs [segment]): search
# only inside the membrane segmentation, grown by the dilation, in tomogram
# pixels. Off for anything else: with it on, a cytosolic particle is searched
# for only next to membranes. gag-bin8.toml uses 40 px at 5.4 A/px (21.6 nm), to
# reach the Gag layer under the membrane; the same 40 px is wider at a coarser pixel.
# use_segmentation_mask = true
# segmentation_mask_dilation_px = 40

[extract]
box_size_px = 48          # EDIT: about 2 x the particle diameter in tomogram pixels; even

[executables]
# Leave as is; set these environment variables before submitting.
motioncor3 = "$MOTIONCOR3"
pytom_create_template = "$PYTOMO_MP_DIR/pytom_create_template.py"
pytom_create_mask = "$PYTOMO_MP_DIR/pytom_create_mask.py"
pytom_match_template = "$PYTOMO_MP_DIR/pytom_match_template.py"
pytom_extract_candidates = "$PYTOMO_MP_DIR/pytom_extract_candidates.py"
